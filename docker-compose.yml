services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: lumen_estudio
    ports:
      - "5432:5432"
    volumes:
      - lumen_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen_estudio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lumen_pg_data:
    name: lumen_pg_data
